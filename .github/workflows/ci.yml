name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest (DAG Integrity & Python Unit Tests)
        env:
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
        run: |
          pytest tests/ -v

      - name: Run SQLFluff Linting on dbt models
        run: |
          sqlfluff lint dbt_project/models --dialect duckdb

  dbt-compile:
    name: dbt Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb dbt-snowflake

      - name: dbt Debug & Compile
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
        run: |
          cd dbt_project
          dbt deps
          dbt compile --target dev
